[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "powa-photonics"
version = "0.1.0"
description = "Core SOST implementation for wavelength-parameterized passive photonics"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
  "h5py>=3.9",
  "numpy>=1.24",
  "scipy>=1.10",
  "torch>=2.1",
  "torchvision>=0.16",
]

classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
